spring:
  cloud:
    gateway:
      routes:
        - id: ride-service
          uri: http://localhost:8081
          predicates:
            - Path=/rides/**
          filters:
            - name: CircuitBreaker
              args:
                name: rideServiceCircuitBreaker
                fallbackUri: forward:/rideServiceFallback

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCircuitBreaker
                fallbackUri: forward:/notificationServiceFallback
